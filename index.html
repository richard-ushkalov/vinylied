<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Vinilyed — Responsive Music Player</title>

        <script type="importmap">
            { "imports": { "music-metadata": "https://esm.sh/music-metadata@11" } }
        </script>

        <link rel="stylesheet" href="style.css">
        <script src="app.js" type="module"></script>
    </head>
    <body>
        <div class="layout">
            <div class="bar">
                <label class="file-button">
                    <span>Выбрать музыку</span>
                    <input class="input" type="file" accept="audio/*" multiple>
                </label>
                <input class="search" type="search" autocomplete="off"
                       placeholder="Поиск по трекам и альбомам" aria-label="Поиск по полке">
            </div>
            <div class="main">
                <div class="scene">
                    <ul class="list"></ul>
                </div>
            </div>

            <div class="progress" role="slider" tabindex="0"
                 aria-label="Позиция в треке"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="progress__fill"></div>
                <div class="progress__handle"></div>
            </div>
        </div>

        <template id="vinyl-template">
            <li class="slot">
                <div class="vinyl">
                    <!-- пластинка лежит ВНУТРИ конверта и остаётся на месте -->
                    <div class="disc">
                        <div class="disc__label"></div>
                    </div>

                    <!-- конверт: шесть граней, при игре отъезжает вбок -->
                    <div class="vinyl__box">
                        <img src="" alt="" class="vinyl__frontside">
                        <img src="" alt="" class="vinyl__backside">
                        <div class="vinyl__side">
                            <p class="vinyl__side__album"></p>
                            <p class="vinyl__side__title"></p>
                        </div>
                        <div class="vinyl__edge vinyl__edge--far"></div>
                        <div class="vinyl__edge vinyl__edge--left"></div>
                        <div class="vinyl__edge vinyl__edge--right"></div>
                    </div>
                </div>
            </li>
        </template>

    </body>
</html>
